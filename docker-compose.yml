x-app-base: &app-base
  build: .
  env_file: .env
  environment:
    DATABASE_URL: postgres://notify:notify@postgres:5432/notify
    REDIS_URL: redis://redis:6379/0
    CELERY_BROKER_URL: redis://redis:6379/1
  depends_on:
    postgres:
      condition: service_healthy
    redis:
      condition: service_healthy
  restart: unless-stopped

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: notify
      POSTGRES_USER: notify
      POSTGRES_PASSWORD: notify
    command: >
      postgres -c max_connections=300
               -c shared_buffers=256MB
               -c synchronous_commit=off
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U notify -d notify"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    command: redis-server --save "" --appendonly yes --maxmemory-policy noeviction
    volumes:
      - redisdata:/data
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  migrate:
    <<: *app-base
    command: python manage.py migrate --noinput
    restart: "no"

  api:
    <<: *app-base
    command: gunicorn config.wsgi:application --config gunicorn.conf.py
    ports:
      - "8000:8000"
    depends_on:
      migrate:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8000/health/live"]
      interval: 10s
      timeout: 3s
      retries: 5

  worker:
    <<: *app-base
    command: >
      celery -A config worker
        --loglevel=INFO
        --pool=threads
        --concurrency=${WORKER_CONCURRENCY:-32}
        --prefetch-multiplier=1
        -Q dispatch,maintenance
    depends_on:
      migrate:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    deploy:
      replicas: ${WORKER_REPLICAS:-2}

  beat:
    <<: *app-base
    command: celery -A config beat --loglevel=INFO --schedule /tmp/celerybeat-schedule
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy

  flower:
    <<: *app-base
    command: celery -A config flower --port=5555 --broker_api=
    ports:
      - "5555:5555"
    depends_on:
      redis:
        condition: service_healthy

volumes:
  pgdata:
  redisdata:
